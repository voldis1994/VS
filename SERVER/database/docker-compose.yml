services:
  postgres:
    image: postgres:16-alpine
    container_name: market-reader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-market_reader}
      POSTGRES_USER: ${DB_USER:-market_reader}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
    # Localhost only — never expose DB on LAN
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-market_reader} -d ${DB_NAME:-market_reader}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: market-reader-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
