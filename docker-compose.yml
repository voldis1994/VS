services:
  postgres:
    image: postgres:16-alpine
    container_name: market-reader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-market_reader}
      POSTGRES_USER: ${DB_USER:-market_reader}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Named volume — clients/brokers survive VS.bat + PC restart.
      # NEVER run: docker compose down -v
      - vs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-market_reader} -d ${DB_NAME:-market_reader}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: market-reader-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - vs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vs_postgres_data:
    name: vs_postgres_data
    external: false
  vs_redis_data:
    name: vs_redis_data
    external: false
