<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VS SISTĒMA</title>
  <style>
    :root {
      --bg: #020302;
      --panel: #0c120c;
      --line: rgba(180, 255, 0, 0.28);
      --text: #f2ffe0;
      --dim: #7f9870;
      --accent: #b4ff00;
      --warn: #ffc14d;
      --err: #ff3b6b;
      --ok: #39ff14;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, "Segoe UI", sans-serif;
    }
    .wrap {
      max-width: 980px; margin: 0 auto; padding: 20px 18px 28px;
      display: flex; flex-direction: column; min-height: 100%; gap: 14px;
    }
    .brand { letter-spacing: 0.28em; color: var(--accent); font-size: 12px; font-weight: 700; }
    h1 { margin: 4px 0 0; font-size: 28px; letter-spacing: 0.08em; }
    .sub { color: var(--dim); font-size: 13px; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .card {
      border: 1px solid var(--line); background: var(--panel); padding: 12px 14px;
    }
    .card .k { font-size: 10px; letter-spacing: 0.16em; color: var(--dim); }
    .card .v { font-size: 18px; margin-top: 6px; font-family: ui-monospace, Consolas, monospace; }
    .card.bad .v { color: var(--err); }
    .card.ok .v { color: var(--ok); }
    .card.warn .v { color: var(--warn); }
    button.go {
      width: 100%; border: 1px solid var(--accent); background: #142014;
      color: var(--accent); font-size: 22px; letter-spacing: 0.18em; font-weight: 800;
      padding: 22px 16px; cursor: pointer;
    }
    button.go:hover { background: #1c2c14; }
    button.go:disabled { opacity: 0.45; cursor: wait; }
    .errbox {
      display: none; border: 1px solid var(--err); color: var(--err);
      padding: 10px 12px; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace;
      font-size: 13px;
    }
    .log {
      flex: 1; min-height: 280px; overflow: auto; border: 1px solid var(--line);
      background: #050805; padding: 10px 12px; font-family: ui-monospace, Consolas, monospace;
      font-size: 12px; line-height: 1.45; white-space: pre-wrap;
    }
    .log .e { color: var(--err); }
    .log .w { color: var(--warn); }
    a { color: var(--accent); }
    .links { font-size: 13px; color: var(--dim); display: flex; gap: 16px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="brand">VS LAUNCHER // 127.0.0.1:18090</div>
      <h1>KOMANDU PANELIS</h1>
      <div class="sub">Šis ir VS palaišanas panelis. Viena poga aizver visu, ņem GitHub un palaiž no jauna. Šo logu neaizver.</div>
    </div>
    <div class="grid">
      <div class="card" id="c-sha"><div class="k">BUILD</div><div class="v" id="sha">…</div></div>
      <div class="card" id="c-upd"><div class="k">GITHUB UPDATE</div><div class="v" id="upd">…</div></div>
      <div class="card" id="c-run"><div class="k">SISTĒMA</div><div class="v" id="run">…</div></div>
    </div>
    <button class="go" id="btn" type="button">PALAIST / RESTARTĒT</button>
    <div class="errbox" id="err"></div>
    <div class="links">
      <a href="http://127.0.0.1:18080" target="_blank">Klienta panelis :18080</a>
      <a href="http://localhost:5173/clients" target="_blank">Admin klienti :5173</a>
      <span id="tunnel"></span>
    </div>
    <div class="log" id="log">Gaidu…\n</div>
  </div>
  <script>
    const logEl = document.getElementById('log');
    const errEl = document.getElementById('err');
    const btn = document.getElementById('btn');
    function lineClass(t) {
      if (/\[KLUDA\]|FAIL|error/i.test(t)) return 'e';
      if (/\[WARN\]|warn/i.test(t)) return 'w';
      return '';
    }
    function addLog(t) {
      const d = document.createElement('div');
      d.className = lineClass(t);
      d.textContent = t.replace(/\n$/, '');
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }
    async function refresh() {
      const s = await fetch('/api/status').then((r) => r.json());
      document.getElementById('sha').textContent = s.local_sha || '—';
      const same = s.local_sha && s.github_sha && s.local_sha === s.github_sha;
      const upd = document.getElementById('upd');
      const cupd = document.getElementById('c-upd');
      if (s.updated || same) { upd.textContent = 'JĀ · ' + (s.github_sha || ''); cupd.className = 'card ok'; }
      else if (s.github_sha) { upd.textContent = 'NĒ · github ' + s.github_sha; cupd.className = 'card warn'; }
      else { upd.textContent = 'NEZINĀMS'; cupd.className = 'card'; }
      const run = document.getElementById('run');
      const crun = document.getElementById('c-run');
      run.textContent = s.phase || (s.running ? 'DARBOJAS' : 'APSTĀDINĀTA');
      crun.className = s.error ? 'card bad' : s.running ? 'card ok' : 'card';
      if (s.error) { errEl.style.display = 'block'; errEl.textContent = s.error; }
      else { errEl.style.display = 'none'; errEl.textContent = ''; }
      btn.disabled = !!s.busy;
      btn.textContent = s.busy ? 'STRĀDĀ…' : 'PALAIST / RESTARTĒT';
      const tun = document.getElementById('tunnel');
      tun.innerHTML = s.tunnel ? '<a href="'+s.tunnel+'" target="_blank">Tunelis '+s.tunnel+'</a>' : '';
    }
    const es = new EventSource('/api/logs');
    es.onmessage = (ev) => addLog(ev.data);
    btn.onclick = async () => {
      btn.disabled = true;
      await fetch('/api/run', { method: 'POST' });
      refresh();
    };
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
