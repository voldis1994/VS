<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VS ADMIN</title>
    <style>
      :root {
        --bg: #050607;
        --side: #07090c;
        --line: #1c242c;
        --text: #eef3f0;
        --mute: #7d8882;
        --ok: #2ef28a;
        --bad: #ff5a5a;
        --warn: #e6b84d;
        --card: #0b1014;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 "Segoe UI", "IBM Plex Sans", sans-serif;
      }
      .layout { display: flex; min-height: 100vh; }
      .sidebar {
        width: 210px;
        background: var(--side);
        border-right: 1px solid var(--line);
        padding: 18px 12px;
      }
      .brand { color: var(--ok); font-size: 22px; font-weight: 800; letter-spacing: 6px; }
      .sub { color: var(--mute); font-size: 10px; letter-spacing: 3px; margin-bottom: 18px; }
      .nav button {
        display: block; width: 100%; text-align: left;
        background: none; border: 0; color: var(--mute);
        padding: 9px 12px; margin: 2px 0; border-radius: 6px; cursor: pointer;
      }
      .nav button.on { background: #102018; color: var(--ok); border-left: 3px solid var(--ok); }
      .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .top {
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        padding: 12px 18px; border-bottom: 1px solid var(--line); background: #0c1116;
      }
      .chip {
        border: 1px solid var(--line); background: var(--card);
        padding: 5px 10px; border-radius: 4px; font-size: 12px;
      }
      .chip.ok { color: var(--ok); } .chip.bad { color: var(--bad); } .chip.warn { color: var(--warn); }
      .content { padding: 18px; overflow: auto; }
      h1 { font-size: 18px; letter-spacing: 2px; margin: 0 0 8px; }
      .note { color: var(--mute); margin-bottom: 14px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
      input, select, button.act {
        background: var(--card); border: 1px solid var(--line); color: var(--text);
        padding: 8px 10px; border-radius: 6px;
      }
      button.act { cursor: pointer; }
      button.pri { background: #102018; color: var(--ok); border-color: #1c3a2a; font-weight: 700; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
      th { color: var(--mute); font-size: 11px; letter-spacing: 1px; }
      .msg { color: var(--mute); min-height: 18px; }
      .err { color: var(--bad); }
      .okt { color: var(--ok); }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">VS</div>
        <div class="sub">CONTROL PANEL</div>
        <nav class="nav" id="nav"></nav>
      </aside>
      <div class="main">
        <header class="top">
          <strong>VS ADMIN</strong>
          <span class="chip" id="chipState">● DISCONNECTED</span>
          <span class="chip" id="chipHealth">HEALTH —</span>
          <span class="chip" id="chipCalc">CALC —</span>
          <span class="chip" id="chipLat">LOCAL</span>
        </header>
        <div class="content" id="view"></div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
