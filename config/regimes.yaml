regimes:
  # Diagnostic 10s labels only for LIVE desk — entry authority is marketSetup (setup-first).
  # All flips require ≥3 agreeing 10s bars (~30s). No 1-bar fast regimes.
  primary_horizon_ms: 10000
  transition_smoothing: 0.1
  confidence_threshold: 0.5
  confirm_bars: 3
  supported:
    - RANGE
    - TREND_UP
    - TREND_DOWN
    - PULLBACK_UPTREND
    - PULLBACK_DOWNTREND
    - COMPRESSION
    - EXPANSION
    - BREAKOUT_UP
    - BREAKOUT_DOWN
    - FAILED_BREAKOUT_UP
    - FAILED_BREAKOUT_DOWN
    - REVERSAL_CANDIDATE
