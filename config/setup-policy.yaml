setup_policy:
  # Unified profitable brain (LIVE = marketSetup.decideUnifiedEntry + robotDesk)
  # Capital 1h+1m → STRUCTURE(swing) → SETUP(sticky) → ENTRY(1m) → BEST OUTCOME
  # Hard: never open without broker SAFETY SL
  horizon_ms: 60000
  min_confidence: 0.0
  confirm_confidence: 0.0
  expiry_ms: 60000
  sticky_confirm_updates: 2
  types:
    - CONTINUATION
    - PULLBACK
    - BREAKOUT
    - FADE
    - FAILED_BREAK
    - NONE
  rules:
    - armed_setup_owns_entry
    - none_only_filtered_1m_impulse
    - no_impulse_against_armed_setup
    - refuse_entry_without_safety_sl
    - freeze_setup_while_open
    - thesis_legs_use_1m_flow
