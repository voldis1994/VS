exit_policy:
  horizon_ms: 10000
  # Keep ≥65% of MFE — max 35% giveback (same as live PeakProtection)
  peak_retention_threshold: 0.65
  remaining_rr_threshold: 0.5
  time_decay_seconds: 1.0
  thesis_failure_enabled: true
  reversal_evidence_enabled: true
  actions:
    - HOLD
    - EXIT_NOW
    - TRAIL
    - TAKE_PROFIT
