<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Logo">
  <defs>
    <linearGradient id="neon" x1="120" y1="80" x2="400" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8FF4A"/>
      <stop offset="0.45" stop-color="#39FF14"/>
      <stop offset="1" stop-color="#1AFF8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#39FF14" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- black plate -->
  <rect width="512" height="512" rx="28" fill="#050505"/>
  <rect width="512" height="512" rx="28" fill="url(#glow)"/>

  <!-- outer HUD rings -->
  <g stroke="url(#neon)" stroke-linecap="round" opacity="0.95" filter="url(#soft)">
    <circle cx="256" cy="256" r="214" stroke-width="1.5" stroke-dasharray="10 14 4 18" opacity="0.55"/>
    <circle cx="256" cy="256" r="198" stroke-width="2.2" stroke-dasharray="70 28 12 40"/>
    <circle cx="256" cy="256" r="178" stroke-width="1.2" opacity="0.7"/>
    <circle cx="256" cy="256" r="162" stroke-width="3" stroke-dasharray="48 22 8 30" opacity="0.9"/>
    <circle cx="256" cy="256" r="142" stroke-width="1.4" stroke-dasharray="2 8" opacity="0.75"/>

    <!-- tick marks -->
    <g stroke-width="2" opacity="0.85">
      <path d="M256 42v18"/>
      <path d="M256 452v18"/>
      <path d="M42 256h18"/>
      <path d="M452 256h18"/>
      <path d="M96 96l12 12"/>
      <path d="M404 96l-12 12"/>
      <path d="M96 416l12-12"/>
      <path d="M404 416l-12-12"/>
    </g>

    <!-- arc brackets -->
    <path d="M120 150a170 170 0 0 1 272 0" stroke-width="2.5" opacity="0.8"/>
    <path d="M132 372a155 155 0 0 0 248 0" stroke-width="2.5" opacity="0.8"/>
    <path d="M78 220a185 185 0 0 0 0 72" stroke-width="3"/>
    <path d="M434 220a185 185 0 0 1 0 72" stroke-width="3"/>
  </g>

  <!-- crest: digital eagle / geometric shards -->
  <g filter="url(#soft)">
    <!-- left outer wing -->
    <path d="M148 210 L188 188 L214 236 L196 268 L154 250 Z"
          fill="rgba(57,255,20,0.14)" stroke="url(#neon)" stroke-width="3" stroke-linejoin="round"/>
    <!-- right outer wing -->
    <path d="M364 210 L324 188 L298 236 L316 268 L358 250 Z"
          fill="rgba(57,255,20,0.14)" stroke="url(#neon)" stroke-width="3" stroke-linejoin="round"/>
    <!-- left inner wing -->
    <path d="M188 236 L220 214 L236 268 L214 292 L184 270 Z"
          fill="rgba(57,255,20,0.2)" stroke="url(#neon)" stroke-width="3" stroke-linejoin="round"/>
    <!-- right inner wing -->
    <path d="M324 236 L292 214 L276 268 L298 292 L328 270 Z"
          fill="rgba(57,255,20,0.2)" stroke="url(#neon)" stroke-width="3" stroke-linejoin="round"/>
    <!-- center downward diamond / arrowhead -->
    <path d="M256 168 L292 248 L256 348 L220 248 Z"
          fill="rgba(57,255,20,0.28)" stroke="url(#neon)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- inner core cut -->
    <path d="M256 208 L274 248 L256 300 L238 248 Z"
          fill="rgba(5,5,5,0.55)" stroke="url(#neon)" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- micro HUD dots -->
  <g fill="#39FF14">
    <circle cx="256" cy="78" r="3.2"/>
    <circle cx="256" cy="434" r="3.2"/>
    <circle cx="78" cy="256" r="3.2"/>
    <circle cx="434" cy="256" r="3.2"/>
  </g>
</svg>
